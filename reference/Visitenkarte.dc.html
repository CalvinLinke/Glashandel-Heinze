<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#d8dee6;font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}
  @media print{body{background:#fff}}
</style>
</helmet>

<div style="padding:60px;display:flex;flex-wrap:wrap;gap:48px;align-items:center;justify-content:center">

  <!-- ===== FRONT (85.6 x 54 mm @10px/mm) ===== -->
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
    <div style="font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.16em;color:#5a6b7d;text-transform:uppercase">Vorderseite</div>
    <div style="width:856px;height:540px;background:#fff;border-radius:14px;box-shadow:0 22px 50px -20px rgba(0,16,49,.45);position:relative;overflow:hidden">
      <!-- left accent stripe -->
      <div style="position:absolute;left:0;top:0;bottom:0;width:14px;background:#0D76C7"></div>
      <div style="position:absolute;left:14px;top:0;bottom:0;width:5px;background:#001031"></div>
      <!-- glass facet motif -->
      <div style="position:absolute;right:-70px;top:-60px;width:300px;height:300px;background:linear-gradient(150deg,rgba(13,118,199,.1),transparent);transform:skewX(-12deg)"></div>
      <img src="assets/mark-h.png" alt="" style="position:absolute;right:42px;bottom:38px;height:150px;opacity:.1" />

      <div style="position:absolute;left:64px;top:54px;right:54px">
        <img src="assets/logo.png" alt="Hubert Heinze GmbH" style="height:62px;width:auto" />
      </div>

      <div style="position:absolute;left:64px;bottom:54px">
        <div style="font-family:'Space Grotesk';font-weight:600;font-size:34px;color:#001031;letter-spacing:-.01em">Tilo Zeibig</div>
        <div style="font-family:'IBM Plex Mono';font-size:13px;letter-spacing:.14em;color:#0D76C7;text-transform:uppercase;margin-top:6px">Geschäftsführer</div>
        <div style="margin-top:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;color:#33414f;line-height:1.4">
          <div><span style="display:inline-block;width:74px;font-family:'IBM Plex Mono';font-size:11px;color:#8593a1;letter-spacing:.06em">TEL</span>+49 34348 556 58</div>
          <div><span style="display:inline-block;width:74px;font-family:'IBM Plex Mono';font-size:11px;color:#8593a1;letter-spacing:.06em">MAIL</span>t.zeibig@glashandel-heinze.de</div>
          <div><span style="display:inline-block;width:74px;font-family:'IBM Plex Mono';font-size:11px;color:#8593a1;letter-spacing:.06em">WEB</span>glashandel-heinze.de</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== BACK ===== -->
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
    <div style="font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.16em;color:#5a6b7d;text-transform:uppercase">Rückseite</div>
    <div style="width:856px;height:540px;background:#001031;border-radius:14px;box-shadow:0 22px 50px -20px rgba(0,16,49,.55);position:relative;overflow:hidden;color:#fff">
      <div style="position:absolute;inset:0;opacity:.5;background:repeating-linear-gradient(90deg,rgba(159,195,233,.1) 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,rgba(159,195,233,.07) 0 1px,transparent 1px 64px)"></div>
      <div style="position:absolute;right:-40px;top:-30px;width:360px;height:600px;transform:skewX(-12deg);background:linear-gradient(180deg,rgba(13,118,199,.3),transparent);border-left:1px solid rgba(159,195,233,.25);overflow:hidden">
        <div style="position:absolute;left:0;top:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)"></div>
      </div>
      <img src="assets/mark-h-white.png" alt="" style="position:absolute;left:64px;top:50%;transform:translateY(-50%);height:230px;opacity:.95" />

      <div style="position:absolute;right:64px;top:64px;text-align:right">
        <div style="font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.18em;color:#9FC3E9;text-transform:uppercase">Glasfachgroßhandel</div>
        <div style="font-family:'Space Grotesk';font-weight:600;font-size:30px;color:#fff;margin-top:10px;line-height:1.1">Glas am Bau<br/>& in der Industrie</div>
      </div>
      <div style="position:absolute;right:64px;bottom:60px;text-align:right;font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.06em;color:rgba(159,195,233,.92);line-height:2">
        BASIS · DESIGN · FASSADE<br/>RAUM · SYSTEM
      </div>
      <div style="position:absolute;left:64px;bottom:48px;font-family:'IBM Plex Mono';font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.08em">FROHBURG · SACHSEN</div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1828,&quot;height&quot;:720}}"></script>
</body>
</html>
